function calcEVPPG(player) {
  const { name, pos, team } = player;
  const passAtt = TEAM_PASS_ATT[team] || 34;
  if (pos === "WR" || pos === "TE") {
    const ts = EV_TARGET_SHARE[name];
    if (!ts) return null;
    const coeff = pos === "TE" ? 1.44 : 1.39;
    return Math.round(passAtt * ts * coeff * 10) / 10;
  }
  if (pos === "RB") {
    const tpg = EV_TARGET_SHARE[name];
    const cs  = EV_CARRY_SHARE[name];
    if (!tpg || !cs) return null;
    const carriesPG = 27 * cs;
    return Math.round((carriesPG * 0.63 + tpg * 1.14) * 10) / 10;
  }
  if (pos === "QB") {
    // Starters take ~100% of team pass volume, so "share" collapses to team pass-attempt
    // volume itself. Rushing floor comes from the QB's own Vegas rush props (already
    // tracked per-player), the same role target/carry share plays for skill positions.
    const v = player.vegas;
    if (!v || v.rush_yds == null) return null;
    const passComponent = passAtt * 0.36;
    const rushComponent = (v.rush_yds * 0.1 + v.rush_td * 6) / 17;
    return Math.round((passComponent + rushComponent) * 10) / 10;
  }
  return null;
}

function adpCurve(adp, pos) {
  // Market-implied median PPG at each ADP tier, calibrated to actual 2026 consensus data
  if (pos === "QB") return adp<=36?20.0:adp<=48?18.0:adp<=72?17.2:adp<=84?17.0:adp<=108?16.5:adp<=120?16.0:adp<=144?15.5:14.5;
  if (pos === "TE") return adp<=20?14.1:adp<=30?13.1:adp<=48?12.0:adp<=60?11.2:adp<=96?9.9:adp<=144?9.0:adp<=160?8.0:7.0;
  if (pos === "RB") return adp<=3?18.2:adp<=6?16.2:adp<=9?15.1:adp<=24?13.9:adp<=35?12.1:adp<=47?11.3:adp<=59?9.9:adp<=71?8.5:adp<=83?8.9:adp<=95?8.4:adp<=120?8.1:adp<=155?5.5:4.5;
  if (pos === "DE") return adp<=134?9.2:adp<=136?8.7:adp<=138?8.1:adp<=140?7.5:adp<=142?6.9:6.3;
  if (pos === "K")  return adp<=146?9.3:adp<=148?8.9:adp<=150?8.5:adp<=152?8.0:adp<=154?7.5:7.0;
  // WR
  return adp<=12?16.5:adp<=24?13.6:adp<=36?12.7:adp<=48?12.6:adp<=60?12.1:adp<=72?11.0:adp<=84?10.0:adp<=96?9.6:adp<=108?9.2:adp<=120?9.3:adp<=160?8.5:7.0;
}

function calcVegasPPG(player) {
  const v = player.vegas;
  let pts = 0;
  if (player.pos === "QB") pts = (v.pass_yds/25)+(v.pass_td*6)+(v.rush_yds*0.1)+(v.rush_td*6);
  else if (player.pos === "RB") pts = (v.rush_yds*0.1)+(v.rush_td*6)+((v.rec||0)*0.5)+(v.rec_yds*0.1)+((v.rec_td||0)*6);
  else if (player.pos === "DE" || player.pos === "K") pts = 0; // scored off ADP curve, not offensive Vegas props
  else pts = (v.rec_yds*0.1)+((v.rec||0)*0.5)+((v.rec_td||0)*6);
  return pts / 17;
}

function calcBlendedPPG(player) {
  const vegasPPG   = calcVegasPPG(player);
  const curvePPG   = adpCurve(player.adp, player.pos);
  const staticPPG  = CONSENSUS_PPG[player.name] ?? null;
  const consensusPPG = staticPPG ?? curvePPG;
  const evPPG = calcEVPPG(player);
  // Injury PPG multiplier: context-aware scaling based on note content, not just severity tier
  // Low/monitor flags assumed already priced into consensus — no additional haircut
  let injuryMult = 1.0;
  let games = 17;
  if (player.injury_flag) {
    const note = (player.injury_flag.note || "").toLowerCase();
    const sev  = player.injury_flag.severity;
    if (note.includes("non-issue") || note.includes("practiced next day") || note.includes("no structural") || note.includes("no week 1 concern")) {
      injuryMult = 1.0; // explicitly cleared — no adjustment
    } else if (note.includes("acl") || note.includes("pup") || note.includes("ir risk") || note.includes("cleanup surgery")) {
      injuryMult = 0.75; games = 11; // ACL/IR risk: project ~11 games
    } else if (note.includes("chronic") || note.includes("never played full")) {
      injuryMult = 1.0; // history only — consensus already prices chronic risk, no additional haircut
    } else if (note.includes("2-4wk") || note.includes("2-4 wk")) {
      injuryMult = 0.88; games = 15; // short-term: ~2-3 games missed early
    } else if (note.includes("turf toe")) {
      injuryMult = 0.90; games = 15; // turf toe can linger all season
    } else if (note.includes("missed") && (note.includes("significant") || note.includes("full season") || note.includes("2 full"))) {
      injuryMult = 0.92; games = 15; // missed significant time but consensus likely prices some of this
    } else if (note.includes("knee history") || note.includes("carry-count")) {
      injuryMult = 0.95; games = 16; // workload management risk, not injury per se
    } else if (sev === "low") {
      injuryMult = 1.0; // all other low flags: already priced into consensus
    } else if (sev === "moderate") {
      injuryMult = 0.95; games = 16;
    } else if (sev === "high") {
      injuryMult = 0.88; games = 15;
    }
  }
  const base = evPPG != null ? (consensusPPG * 0.60) + (evPPG * 0.40) : consensusPPG;
  const blended = base * injuryMult;
  const ppg = Math.round(blended * 10) / 10;
  // Display copy of EV PPG also carries the injury adjustment, so the EV column
  // doesn't contradict the (already injury-adjusted) blended Consensus PPG next to it.
  const evPPGDisplay = evPPG != null ? Math.round(evPPG * injuryMult * 10) / 10 : null;
  return { ppg, season: Math.round(ppg * games * 10) / 10, games, vegasPPG: Math.round(vegasPPG*10)/10, consensusPPG: Math.round(consensusPPG*10)/10, evPPG: evPPGDisplay };
}

function getTier(pos, ppg) {
  const t = {
    QB:[[29,"Elite"],[25,"QB1"],[21,"QB1/2"],[18,"QB2"],[0,"Stream"]],
    RB:[[18,"Elite"],[14,"RB1"],[11,"RB1/2"],[8,"RB2"],[5,"RB3"],[0,"HC"]],
    WR:[[16,"Elite"],[12,"WR1"],[10,"WR1/2"],[8,"WR2"],[6,"WR3"],[0,"Depth"]],
    TE:[[12,"Elite"],[9,"TE1"],[7,"TE1/2"],[5,"TE2"],[0,"Stream"]],
    DE:[[9,"Elite"],[7.8,"DST1"],[7.0,"DST1/2"],[6.3,"DST2"],[0,"Stream"]],
    K:[[9.2,"Elite"],[8.6,"K1"],[8.0,"K1/2"],[7.3,"K2"],[0,"Stream"]],
  };
  for (const [thresh, label] of (t[pos]||t.WR)) if (ppg >= thresh) return label;
  return "Depth";
}

function getValue(ppg, adp, pos) {
  // exp = ADP-curve (market-implied production at this draft slot). diff = consensus minus market.
  let exp;
  // exp = ADP-implied production (what the market prices in at this draft slot)
  // Signal: consensus beats market = UNDERVALUED; misses market = OVERVALUED
  if (pos === "QB") {
    exp = adp<=36?20.0:adp<=48?18.0:adp<=72?17.2:adp<=84?17.0:adp<=108?16.5:adp<=120?16.0:adp<=144?15.5:14.5;
  } else if (pos === "TE") {
    exp = adp<=20?14.1:adp<=30?13.1:adp<=48?12.0:adp<=60?11.2:adp<=96?9.9:adp<=144?9.0:adp<=160?8.0:7.0;
  } else if (pos === "RB") {
    exp = adp<=3?18.2:adp<=6?16.2:adp<=9?15.1:adp<=24?13.9:adp<=35?12.1:adp<=47?11.3:adp<=59?9.9:adp<=71?8.5:adp<=83?8.9:adp<=95?8.4:adp<=120?8.1:adp<=155?5.5:4.5;
  } else if (pos === "DE") {
    exp = adp<=134?9.2:adp<=136?8.7:adp<=138?8.1:adp<=140?7.5:adp<=142?6.9:6.3;
  } else if (pos === "K") {
    exp = adp<=146?9.3:adp<=148?8.9:adp<=150?8.5:adp<=152?8.0:adp<=154?7.5:7.0;
  } else {
    exp = adp<=12?16.5:adp<=24?13.6:adp<=36?12.7:adp<=48?12.6:adp<=60?12.1:adp<=72?11.0:adp<=84?10.0:adp<=96?9.6:adp<=108?9.2:adp<=120?9.3:adp<=160?8.5:7.0;
  }
  const d = ppg - exp;
  const diff = Math.round(d*10)/10;
  if (d >= 2.0) return { label:"UNDERVALUED", shade:"strong", color:"#4ade80", bg:"#052e16", exp, diff };
  if (d >= 0.7) return { label:"UNDERVALUED", shade:"mild",   color:"#86efac", bg:"#0a2018", exp, diff };
  if (d <= -2.0) return { label:"OVERVALUED",  shade:"strong", color:"#f87171", bg:"#2d0a0a", exp, diff };
  if (d <= -0.7) return { label:"OVERVALUED",  shade:"mild",   color:"#fca5a5", bg:"#1a0d0d", exp, diff };
  return { label:"FAIR", shade:"fair", color:"#f59e0b", bg:"#1c1506", exp, diff };
}

const SEVERITY = { low:"#f59e0b", moderate:"#f97316", high:"#ef4444" };
const PC = { QB:"#a78bfa", RB:"#34d399", WR:"#38bdf8", TE:"#f472b6", DE:"#fb923c", K:"#facc15" };
const PC_BG = { QB:"#1e1b4b", RB:"#022c22", WR:"#0c2a3a", TE:"#3b0a1e", DE:"#431407", K:"#422006" };

const fmtADP = a => a % 1 === 0 ? a.toFixed(1) : a.toFixed(1);

function DraftBoard() {
  const [search, setSearch]     = useState("");
  const [pos, setPos]           = useState("ALL");
  const [sortBy, setSortBy]     = useState("adp");
  const [expanded, setExpanded] = useState(null);
  const [myPicks, setMyPicks]   = useState(new Set());
  const [gone, setGone]         = useState(new Set());
  const [watch, setWatch]       = useState(new Set());
  const [filterWatch, setFilterWatch] = useState(false);
  const [filterGone, setFilterGone] = useState(false);
  const [tab, setTab]           = useState("BOARD");
  const [clockMode, setClockMode]     = useState(false);
  const [draftSlot, setDraftSlot]     = useState(3);
  const [teams, setTeams]             = useState(12);
  const [clockWindow, setClockWindow] = useState(12);
  const [clockPos, setClockPos]       = useState("ALL");

  const toggleMine = (name,e) => {
    e.stopPropagation();
    setMyPicks(prev => { const n=new Set(prev); n.has(name)?n.delete(name):(n.add(name),gone.has(name)&&setGone(g=>{const ng=new Set(g);ng.delete(name);return ng;}),setExpanded(null)); return n; });
  };
  const toggleGone = (name,e) => {
    e.stopPropagation();
    setGone(prev => { const n=new Set(prev); n.has(name)?n.delete(name):(n.add(name),myPicks.has(name)&&setMyPicks(m=>{const nm=new Set(m);nm.delete(name);return nm;}),setExpanded(null)); return n; });
  };
  const toggleWatch = (name,e) => {
    e.stopPropagation();
    setWatch(prev => { const n=new Set(prev); n.has(name)?n.delete(name):n.add(name); return n; });
  };

  const processed = useMemo(() => {
    const seen = new Set();
    return PLAYERS
      .filter(p => {
        if (seen.has(p.name)) return false;
        seen.add(p.name);
        if (p.pos === "DE" || p.pos === "K") return true;
        return p.vegas && ((p.vegas.rec_yds||0)+(p.vegas.pass_yds||0)+(p.vegas.rush_yds||0)>0);
      })
      .map(p => {
        const {ppg,season,games,vegasPPG,consensusPPG,evPPG} = calcBlendedPPG(p);
        return {...p,ppg,season,games,vegasPPG,consensusPPG,evPPG,tier:getTier(p.pos,ppg),value:getValue(ppg,p.adp,p.pos)};
      });
  },[]);

  const active = useMemo(() => {
    let arr = filterGone
      ? processed.filter(p => gone.has(p.name) || myPicks.has(p.name))
      : processed.filter(p => !myPicks.has(p.name) && !gone.has(p.name));
    if (!filterGone && filterWatch) arr = arr.filter(p => watch.has(p.name));
    if (pos!=="ALL") arr=arr.filter(p=>p.pos===pos);
    if (search) { const q=search.toLowerCase(); arr=arr.filter(p=>p.name.toLowerCase().includes(q)||p.team.toLowerCase().includes(q)); }
    const sorted = [...arr].sort((a,b)=>sortBy==="ppg"?b.ppg-a.ppg:sortBy==="ev"?(b.evPPG??-Infinity)-(a.evPPG??-Infinity):a.adp-b.adp);
    // Inject tier breaks when filtering by position and sorting by ADP
    // A tier break = PPG gap ≥1.0 between consecutive players
    if (pos !== "ALL" && sortBy === "adp" && sorted.length > 1) {
      let tierNum = 1;
      const withTiers = [];
      for (let i = 0; i < sorted.length; i++) {
        const p = sorted[i];
        if (i > 0) {
          const gap = sorted[i-1].ppg - p.ppg;
          if (gap >= 1.0) {
            tierNum++;
            const adpRange = `ADP ${Math.round(p.adp)}+`;
            withTiers.push({ __tierBreak: true, tierNum, adpRange, ppg: p.ppg, key: `tier-${tierNum}` });
          }
        }
        withTiers.push({ ...p, tierNum });
      }
      return withTiers;
    }
    return sorted.map(p => ({ ...p, tierNum: null }));
  },[processed,myPicks,gone,watch,filterWatch,filterGone,pos,search,sortBy]);

  // Snake pick sequence: slot 3, 12 teams → [3,22,27,46,51,...]
  const myPickSequence = useMemo(() => {
    const picks = [];
    const slot = Math.max(1, Math.min(draftSlot, teams));
    for (let round = 1; round <= 20; round++) {
      const isEven = round % 2 === 0;
      const pick = isEven ? (teams - slot + 1) + (round - 1) * teams : slot + (round - 1) * teams;
      picks.push(pick);
    }
    return picks;
  }, [draftSlot, teams]);

  // CLOCK: rolling window of N available players by ADP
  const clockActive = useMemo(() => {
    if (!clockMode) return [];
    let avail = processed
      .filter(p => !gone.has(p.name) && !myPicks.has(p.name))
      .sort((a, b) => a.adp - b.adp);
    if (clockPos !== "ALL") avail = avail.filter(p => p.pos === clockPos);
    const sliced = avail.slice(0, clockWindow);
    // Inject tier breaks when filtering by position
    if (clockPos !== "ALL" && sliced.length > 1) {
      let tierNum = 1;
      const withTiers = [];
      for (let i = 0; i < sliced.length; i++) {
        const p = sliced[i];
        if (i > 0) {
          const gap = sliced[i-1].ppg - p.ppg;
          if (gap >= 1.0) {
            tierNum++;
            withTiers.push({ __tierBreak: true, tierNum, adpRange: `ADP ${Math.round(p.adp)}+`, ppg: p.ppg, key: `ctier-${tierNum}` });
          }
        }
        withTiers.push({ ...p, tierNum });
      }
      return withTiers;
    }
    return sliced.map(p => ({ ...p, tierNum: null }));
  }, [clockMode, processed, myPicks, gone, clockPos, clockWindow]);

  const myPicksList = useMemo(()=>processed.filter(p=>myPicks.has(p.name)).sort((a,b)=>a.adp-b.adp),[processed,myPicks]);
  const goneList    = useMemo(()=>processed.filter(p=>gone.has(p.name)||myPicks.has(p.name)).sort((a,b)=>a.adp-b.adp),[processed,gone,myPicks]);

  const SLOTS = [
    {key:"QB",  label:"QB",   pos:["QB"]},
    {key:"RB1", label:"RB",   pos:["RB"]},
    {key:"RB2", label:"RB",   pos:["RB"]},
    {key:"WR1", label:"WR",   pos:["WR"]},
    {key:"WR2", label:"WR",   pos:["WR"]},
    {key:"FLX", label:"FLEX", pos:["RB","WR","TE"]},
    {key:"TE",  label:"TE",   pos:["TE"]},
    {key:"DE",  label:"D/ST", pos:["DE"]},
    {key:"K",   label:"K",    pos:["K"]},
    {key:"BE1", label:"BE",   pos:["QB","RB","WR","TE","DE","K"], bench:true},
    {key:"BE2", label:"BE",   pos:["QB","RB","WR","TE","DE","K"], bench:true},
    {key:"BE3", label:"BE",   pos:["QB","RB","WR","TE","DE","K"], bench:true},
    {key:"BE4", label:"BE",   pos:["QB","RB","WR","TE","DE","K"], bench:true},
  ];

  const rosterSlots = useMemo(() => {
    const picks = [...myPicksList];
    const assigned = new Array(SLOTS.length).fill(null);
    const used = new Set();
    SLOTS.forEach((slot, si) => {
      if (slot.bench) return;
      const match = picks.find(p => !used.has(p.name) && slot.pos.includes(p.pos));
      if (match) { assigned[si] = match; used.add(match.name); }
    });
    SLOTS.forEach((slot, si) => {
      if (!slot.bench) return;
      const match = picks.find(p => !used.has(p.name));
      if (match) { assigned[si] = match; used.add(match.name); }
    });
    return assigned;
  }, [myPicksList]);

  return (
    <div style={{background:"#080c14",minHeight:"100vh",fontFamily:"'JetBrains Mono','Courier New',monospace",color:"#e2e8f0",maxWidth:"100%"}}>

      {/* HEADER */}
      <div style={{background:"linear-gradient(135deg,#0f172a 0%,#1e1040 50%,#0f172a 100%)",borderBottom:"1px solid #1e293b",padding:"20px 16px 16px",position:"relative",overflow:"hidden"}}>
        <div style={{position:"absolute",top:0,left:0,right:0,bottom:0,backgroundImage:"radial-gradient(ellipse at 70% 50%, #6d28d922 0%, transparent 70%)",pointerEvents:"none"}} />
        <div style={{fontSize:11,color:"#7c3aed",letterSpacing:"0.2em",marginBottom:6,fontWeight:700}}>2026 · HALF-PPR · 6PT PASS TD · 12 TEAM</div>
        <h1 style={{fontSize:24,fontWeight:800,margin:0,background:"linear-gradient(135deg,#f8fafc,#a78bfa)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",letterSpacing:"-0.03em"}}>Draft Value Model</h1>
        <div style={{marginTop:6,fontSize:12,color:"#94a3b8"}}>Consensus PPG = 60% projections + 40% EV Model, injury-adjusted · Value = vs. ADP expectation</div>
        <div style={{marginTop:10,display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,flexWrap:"wrap"}}>
          <span style={{fontSize:10,color:"#94a3b8"}}>📊 NFLFantasyEdge · Updated Aug 31, 2026</span>
          <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
            <label style={{display:'flex',alignItems:'center',gap:5,fontSize:10,color:'#94a3b8',fontWeight:600}}>
              DRAFT SLOT
              <input type="number" min={1} max={teams} value={draftSlot} onChange={e=>setDraftSlot(Number(e.target.value))}
                style={{width:38,background:'#0f172a',border:'1px solid #4f6380',borderRadius:4,color:'#a78bfa',padding:'4px 6px',fontSize:12,fontFamily:'inherit',textAlign:'center',fontWeight:800}} />
              <span style={{color:'#94a3b8',fontSize:10}}>/ {teams}</span>
            </label>
            {(myPicks.size > 0 || gone.size > 0) && (
              <button onClick={()=>{setMyPicks(new Set());setGone(new Set());}} style={{background:'#1a0a0a',border:'1px solid #7f1d1d',color:'#f87171',borderRadius:6,padding:'4px 10px',fontSize:9,fontWeight:700,cursor:'pointer',fontFamily:'inherit',letterSpacing:'0.1em'}}>
                ↺ RESET ({myPicks.size + gone.size})
              </button>
            )}
          </div>
        </div>
      </div>

      {/* TAB BAR */}
      <div style={{display:"flex",borderBottom:"1px solid #1e293b",background:"#0b1120"}}>
        {["BOARD","ROSTER"].map(t => (
          <button key={t} onClick={()=>setTab(t)} style={{
            flex:1,padding:"11px 0",fontSize:11,fontWeight:700,letterSpacing:"0.1em",
            cursor:"pointer",fontFamily:"inherit",border:"none",
            borderBottom:`2px solid ${tab===t?"#7c3aed":"transparent"}`,
            background:"transparent",
            color:tab===t?"#a78bfa":"#94a3b8"
          }}>{t}{t==="ROSTER"&&myPicks.size>0?` (${myPicks.size})`:""}</button>
        ))}
      </div>

      {/* ── BOARD TAB ── */}
      {tab==="BOARD" && (
        <>
          {/* CONTROLS */}
          <div style={{padding:"12px",borderBottom:"1px solid #1e293b",background:"#0b1120"}}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍  Search player or team..."
              style={{width:"100%",boxSizing:"border-box",background:"#131c2e",border:"1px solid #2d3f5a",borderRadius:8,color:"#e2e8f0",padding:"10px 14px",fontSize:13,outline:"none",fontFamily:"inherit",marginBottom:10}} />
            <div style={{display:"flex",gap:6,marginBottom:10}}>
              {["ALL","QB","RB","WR","TE","DE","K"].map(p => (
                <button key={p} onClick={()=>setPos(p)} style={{
                  flex:"1 1 0",minWidth:44,
                  background:pos===p?(PC[p]||"#7c3aed"):PC_BG[p]||"#131c2e",
                  border:`1px solid ${pos===p?(PC[p]||"#7c3aed"):"#2d3f5a"}`,
                  color:pos===p?"#080c14":"#94a3b8",
                  borderRadius:7,padding:"8px 4px",fontSize:12,cursor:"pointer",fontFamily:"inherit",fontWeight:700
                }}>{p}</button>
              ))}
            </div>
            <div style={{display:"flex",gap:6,alignItems:"center"}}>
              {[["ev","EV"],["ppg","PPG"],["adp","ADP"]].map(([v,l])=>(

              <button onClick={()=>setFilterGone(!filterGone)} style={{

                border:`1px solid ${filterGone?"#ef4444":"#2d3f5a"}`,

                borderRadius:6,padding:"7px 4px",fontSize:10,cursor:"pointer",fontFamily:"inherit",fontWeight:600,whiteSpace:"nowrap"
              }}>✕ GONE{(gone.size+myPicks.size)>0?` (${gone.size+myPicks.size})`:""}</button>
              <button onClick={()=>setClockMode(!clockMode)} style={{
                flex:1,background:clockMode?"#0c1a0c":"#131c2e",

          {clockMode && (

              <span style={{fontSize:10,color:"#4ade80",fontWeight:700,letterSpacing:"0.1em"}}>⏱ ON THE CLOCK</span>
              <label style={{fontSize:10,color:"#94a3b8",display:"flex",alignItems:"center",gap:4}}>
                SLOT
                <input type="number" min={1} max={teams} value={draftSlot} onChange={e=>setDraftSlot(Number(e.target.value))}
                  style={{width:36,background:"#0f1f0f",border:"1px solid #166534",borderRadius:4,color:"#4ade80",padding:"3px 5px",fontSize:11,fontFamily:"inherit",textAlign:"center"}} />
              </label>
              <label style={{fontSize:10,color:"#94a3b8",display:"flex",alignItems:"center",gap:4}}>
                TEAMS
                <input type="number" min={2} max={20} value={teams} onChange={e=>setTeams(Number(e.target.value))}
                  style={{width:36,background:"#0f1f0f",border:"1px solid #166534",borderRadius:4,color:"#4ade80",padding:"3px 5px",fontSize:11,fontFamily:"inherit",textAlign:"center"}} />
              </label>
              <label style={{fontSize:10,color:"#94a3b8",display:"flex",alignItems:"center",gap:4}}>
                SHOW
                <input type="number" min={3} max={30} value={clockWindow} onChange={e=>setClockWindow(Number(e.target.value))}
                  style={{width:36,background:"#0f1f0f",border:"1px solid #166534",borderRadius:4,color:"#4ade80",padding:"3px 5px",fontSize:11,fontFamily:"inherit",textAlign:"center"}} />
              </label>
              <div style={{display:"flex",gap:4,marginLeft:"auto"}}>
                {["ALL","QB","RB","WR","TE","DE","K"].map(p=>(
                  <button key={p} onClick={()=>setClockPos(p)} style={{
                    background:clockPos===p?(PC[p]||"#22c55e"):"#0f1f0f",
                    border:`1px solid ${clockPos===p?(PC[p]||"#22c55e"):"#166534"}`,
                    color:clockPos===p?"#080c14":"#4ade80",
                    borderRadius:5,padding:"4px 8px",fontSize:10,cursor:"pointer",fontFamily:"inherit",fontWeight:700
                  }}>{p}</button>
                ))}
              </div>
            </div>
          )}

          {/* TABLE */}
          <div style={{overflowX:"auto",overflowY:"auto",WebkitOverflowScrolling:"touch",height:"calc(100vh - 280px)"}}>
            <table style={{borderCollapse:"collapse",width:"100%",maxWidth:1500,margin:"0 auto",tableLayout:"fixed",fontFamily:"inherit"}}>
              <colgroup>
                <col className="col-status" style={{width:170}}/>
                <col className="col-player" style={{width:190}}/>
                <col className="col-team" style={{width:70}}/>
                <col className="col-injury" style={{width:100}}/>
                <col className="col-value" style={{width:120}}/>
                <col className="col-ev" style={{width:70}}/>
                <col className="col-ppg" style={{width:70}}/>
                <col className="col-adp" style={{width:65}}/>
                <col className="col-tier" style={{width:75}}/>
              </colgroup>
              <thead style={{position:"sticky",top:0,zIndex:20,background:"#0b1120"}}>
                <tr>
                  <th className="frozen-col cell-status" style={{padding:"9px 10px",fontSize:10,color:"#94a3b8",fontWeight:600,borderBottom:"1px solid #1e293b",position:"sticky",left:0,zIndex:30,background:"#0b1120"}}>
                    <div style={{display:"flex",gap:4}}>
                      <span className="status-btn" style={{flex:"1 1 0",textAlign:"center",padding:"4px 5px",border:"1.5px solid transparent",lineHeight:1}}><span className="label-full">DRAFTED</span><span className="label-icon">✓</span></span>
                      <span className="status-btn" style={{flex:"1 1 0",textAlign:"center",padding:"4px 5px",border:"1.5px solid transparent",lineHeight:1}}><span className="label-full">GONE</span><span className="label-icon">✕</span></span>
                      <span className="status-btn" style={{flex:"1 1 0",textAlign:"center",padding:"4px 5px",border:"1.5px solid transparent",lineHeight:1}}><span className="label-full">FAV</span><span className="label-icon">★</span></span>
                    </div>
                  </th>
                  <th className="frozen-col frozen-player" style={{padding:"9px 10px",textAlign:"left",fontSize:10,color:"#94a3b8",letterSpacing:"0.12em",fontWeight:600,borderBottom:"1px solid #1e293b",position:"sticky",left:170,zIndex:30,background:"#0b1120"}}>PLAYER</th>
                  <th className="cell-team" style={{padding:"9px 10px",textAlign:"left",fontSize:10,color:"#94a3b8",letterSpacing:"0.12em",fontWeight:600,borderBottom:"1px solid #1e293b",whiteSpace:"nowrap"}}>TEAM</th>
                  <th style={{padding:"9px 10px",textAlign:"center",fontSize:10,color:"#94a3b8",letterSpacing:"0.12em",fontWeight:600,borderBottom:"1px solid #1e293b",whiteSpace:"nowrap"}}>INJURY</th>
                  <th style={{padding:"9px 10px",textAlign:"left",fontSize:10,color:"#94a3b8",letterSpacing:"0.12em",fontWeight:600,borderBottom:"1px solid #1e293b",whiteSpace:"nowrap"}}>VALUE</th>
                  <th className="cell-ev" style={{padding:"9px 10px",textAlign:"right",fontSize:10,color:"#a78bfa",letterSpacing:"0.12em",fontWeight:600,borderBottom:"1px solid #1e293b",whiteSpace:"nowrap"}}><span className="label-full">EV PPG</span><span className="label-icon-text">EV</span></th>
                  <th className="cell-ppg" style={{padding:"9px 10px",textAlign:"right",fontSize:10,color:"#94a3b8",letterSpacing:"0.12em",fontWeight:600,borderBottom:"1px solid #1e293b",whiteSpace:"nowrap"}}><span className="label-full">CONSENSUS PPG</span><span className="label-icon-text">CONS</span></th>
                  <th className="cell-adp" style={{padding:"9px 10px",textAlign:"right",fontSize:10,color:"#94a3b8",letterSpacing:"0.12em",fontWeight:600,borderBottom:"1px solid #1e293b",whiteSpace:"nowrap"}}>ADP</th>
                  <th className="cell-tier" style={{padding:"9px 10px",textAlign:"center",fontSize:10,color:"#94a3b8",letterSpacing:"0.12em",fontWeight:600,borderBottom:"1px solid #1e293b",whiteSpace:"nowrap"}}>TIER</th>
                </tr>
              </thead>
              <tbody>
          {(clockMode ? clockActive : active).map((p) => {
            // Tier break divider row
            if (p.__tierBreak) return (
              <tr key={p.key}>
                <td colSpan={9} style={{padding:'0'}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,padding:'10px 12px 6px',background:'#0b1120'}}>
                    <div style={{flex:1,height:'1px',background:'#1e293b'}} />
                    <span style={{fontSize:12,fontWeight:800,letterSpacing:'0.1em',color:'#94a3b8',whiteSpace:'nowrap'}}>
                      TIER {p.tierNum} · {p.adpRange} · ~{p.ppg.toFixed(1)} PPG
                    </span>
                    <div style={{flex:1,height:'1px',background:'#1e293b'}} />
                  </div>
                </td>
              </tr>
            );
            const isExp = expanded===p.name;
            const posColor = PC[p.pos];
            const posBg = PC_BG[p.pos];
            const rowBg = isExp?'#111827':watch.has(p.name)?'#1a1400':'#080c14';
            return (
              <React.Fragment key={p.name}>
                <tr onClick={()=>setExpanded(isExp?null:p.name)}
                  style={{borderBottom:'1px solid #0f1825',cursor:'pointer',background:rowBg,outline:watch.has(p.name)?'1px solid #f59e0b44':undefined}}>
                  <td className="frozen-col cell-status" style={{padding:'8px 10px',verticalAlign:'middle',position:'sticky',left:0,zIndex:10,background:rowBg,borderLeft:watch.has(p.name)?'3px solid #f59e0b':'3px solid transparent'}}>
                      {/* Action pill buttons */}
                      <div style={{display:'flex',flexDirection:'row',gap:4}}>
                        <span className="status-btn" onClick={e=>toggleMine(p.name,e)}
                          title="Mark as drafted"
                          style={{display:'block',textAlign:'center',fontSize:9,fontWeight:700,cursor:'pointer',userSelect:'none',padding:'4px 5px',borderRadius:4,lineHeight:1,flex:'1 1 0',
                            background:myPicks.has(p.name)?'#052e16':'transparent',
                            border:`1.5px solid ${myPicks.has(p.name)?'#22c55e':'#16a34a'}`,
                            color:myPicks.has(p.name)?'#22c55e':'#86efac'}}><span className="label-full">DRAFTED</span><span className="label-icon">✓</span></span>
                        <span className="status-btn" onClick={e=>toggleGone(p.name,e)}
                          title="Mark off the board"
                          style={{display:'block',textAlign:'center',fontSize:9,fontWeight:700,cursor:'pointer',userSelect:'none',padding:'4px 5px',borderRadius:4,lineHeight:1,flex:'1 1 0',
                            background:gone.has(p.name)?'#2d0a0a':'transparent',
                            border:`1.5px solid ${gone.has(p.name)?'#ef4444':'#dc2626'}`,
                            color:gone.has(p.name)?'#ef4444':'#fca5a5'}}><span className="label-full">GONE</span><span className="label-icon">✕</span></span>
                        <span className="status-btn" onClick={e=>toggleWatch(p.name,e)}
                          title="Add to watch list"
                          style={{display:'block',textAlign:'center',fontSize:9,fontWeight:700,cursor:'pointer',userSelect:'none',padding:'4px 5px',borderRadius:4,lineHeight:1,flex:'1 1 0',
                            background:watch.has(p.name)?'#1c1205':'transparent',
                            border:`1.5px solid ${watch.has(p.name)?'#f59e0b':'#d97706'}`,
                            color:watch.has(p.name)?'#fbbf24':'#fde68a'}}><span className="label-full">FAV</span><span className="label-icon">★</span></span>
                      </div>
                  </td>
                  <td className="frozen-col frozen-player" style={{padding:'8px 10px',verticalAlign:'middle',position:'sticky',left:170,zIndex:10,background:rowBg}}>
                      <div style={{fontSize:13,fontWeight:700,color:'#f1f5f9',display:'flex',alignItems:'center',gap:6,lineHeight:1.2,minWidth:0}}>
                        <span style={{wordBreak:'break-word',whiteSpace:'normal',lineHeight:1.3,minWidth:0}}>{watch.has(p.name)&&<span style={{color:'#fbbf24',marginRight:3,fontSize:11}}>★</span>}{p.name}</span>
                      </div>
                      <div style={{display:'flex',alignItems:'center',gap:3,marginTop:1,flexWrap:'nowrap'}}>
                        <span style={{background:posBg,color:posColor,fontSize:8,fontWeight:800,padding:'1px 4px',borderRadius:3,border:`1px solid ${posColor}44`,flexShrink:0}}>{p.pos}</span>
                        <span className="team-inline" style={{fontSize:9,fontWeight:700,color:'#94a3b8',flexShrink:0}}>{p.team}</span>
                      </div>
                  </td>
                  <td className="cell-team" style={{padding:'10px',verticalAlign:'middle'}}>
                    <span style={{fontSize:12,fontWeight:800,color:'#94a3b8'}}>{p.team}</span>
                  </td>
                  <td className="cell-injury" style={{padding:'10px',textAlign:'center',verticalAlign:'middle'}}>
                    {p.injury_flag && p.injury_flag.current !== false
                      ? <span style={{fontSize:9,fontWeight:800,color:SEVERITY[p.injury_flag.severity],background:SEVERITY[p.injury_flag.severity]+'22',padding:'2px 7px',borderRadius:10,border:`1px solid ${SEVERITY[p.injury_flag.severity]}66`,letterSpacing:'0.05em',whiteSpace:'nowrap'}}>
                          <span className="value-full">{p.injury_flag.severity.toUpperCase()}</span>
                          <span className="value-short">{p.injury_flag.severity==="moderate"?"MOD":p.injury_flag.severity.toUpperCase()}</span>
                        </span>
                      : <span style={{color:'#94a3b8'}}>—</span>}
                  </td>
                  <td className="cell-value" style={{padding:'10px',verticalAlign:'middle'}}>
                    <span style={{fontSize:11,fontWeight:800,color:p.value.color,background:p.value.bg,padding:'2px 6px',borderRadius:4,border:`1px solid ${p.value.color}55`,whiteSpace:'nowrap'}}>
                      <span className="value-full">{p.value.label}</span>
                      <span className="value-short">{p.value.label==="UNDERVALUED"?"UNDER":p.value.label==="OVERVALUED"?"OVER":"FAIR"}</span>
                    </span>
                  </td>
                  <td className="cell-ev" style={{padding:'10px',textAlign:'right',verticalAlign:'middle',whiteSpace:'nowrap'}}>
                    {p.evPPG != null
                      ? <><div className="ev-main" style={{fontSize:15,fontWeight:800,color:'#a78bfa'}}>{p.evPPG}</div>
                          <div className="ev-sub" style={{fontSize:11,color:p.evPPG>p.ppg?'#4ade80':p.evPPG<p.ppg?'#f87171':'#94a3b8'}}>{p.evPPG>p.ppg?'▲':p.evPPG<p.ppg?'▼':'='} cons</div></>
                      : <div style={{fontSize:11,color:'#94a3b8'}}>—</div>
                    }
                  </td>
                  <td className="cell-ppg" style={{padding:'10px',textAlign:'right',verticalAlign:'middle',whiteSpace:'nowrap'}}>
                    <span style={{fontSize:15,fontWeight:800,color:posColor}}>{p.ppg}</span>
                  </td>
                  <td className="cell-adp" style={{padding:'10px',textAlign:'right',verticalAlign:'middle',fontSize:12,color:'#94a3b8',fontWeight:600,whiteSpace:'nowrap'}}>{fmtADP(p.adp)}</td>
                  <td className="cell-tier" style={{padding:'10px',textAlign:'center',verticalAlign:'middle',fontSize:11,color:'#94a3b8',fontWeight:600,whiteSpace:'nowrap'}}>
                    {p.tierNum ? <span style={{background:'#1e293b',color:'#94a3b8',fontSize:9,fontWeight:800,padding:'2px 7px',borderRadius:10,border:'1px solid #334155',letterSpacing:'0.05em'}}>T{p.tierNum}</span> : '—'}
                  </td>
                </tr>
                {isExp && (
                  <tr>
                    <td colSpan={9} style={{background:'#0d1424',padding:'14px 12px 14px 44px',fontSize:12}}>
                      <div style={{marginBottom:12}}>
                        <div style={{color:'#94a3b8',fontSize:9,letterSpacing:'0.12em',marginBottom:4,fontWeight:700}}>ROLE</div>
                        <div style={{color:'#94a3b8'}}>{p.role}</div>
                        <div style={{color:'#94a3b8',marginTop:3}}>vs: {p.competition}</div>
                      </div>
                      {p.injury_flag && p.injury_flag.current !== false && (
                        <div style={{marginBottom:12,padding:'8px 10px',background:SEVERITY[p.injury_flag.severity]+'11',borderRadius:6,border:`1px solid ${SEVERITY[p.injury_flag.severity]}33`}}>
                          <div style={{color:SEVERITY[p.injury_flag.severity],fontSize:9,letterSpacing:'0.1em',marginBottom:4,fontWeight:800}}>⚠ {p.injury_flag.severity.toUpperCase()} INJURY</div>
                          <div style={{color:'#94a3b8'}}>{p.injury_flag.note}</div>
                          {p.games<17&&<div style={{color:'#f97316',marginTop:4,fontSize:11}}>Season adj: {p.games}g → {p.season} pts</div>}
                        </div>
                      )}
                      {p.injury_flag && p.injury_flag.current === false && (
                        <div style={{marginBottom:12,padding:'8px 10px',background:'#111827',borderRadius:6,border:'1px solid #1e293b'}}>
                          <div style={{color:'#94a3b8',fontSize:9,letterSpacing:'0.1em',marginBottom:4,fontWeight:800}}>DURABILITY NOTE — NOT CURRENTLY INJURED</div>
                          <div style={{color:'#94a3b8'}}>{p.injury_flag.note}</div>
                        </div>
                      )}
                      <div style={{marginBottom:12}}>
                        <div style={{color:'#94a3b8',fontSize:9,letterSpacing:'0.12em',marginBottom:6,fontWeight:700}}>VEGAS LINES (DK)</div>
                        <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
                          {Object.entries(p.vegas).map(([k,v])=>v>0&&(
                            <div key={k} style={{color:'#94a3b8',fontSize:11}}>{k.replace(/_/g,' ')}: <span style={{color:'#e2e8f0',fontWeight:700}}>{v}</span></div>
                          ))}
                        </div>
                      </div>
                      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:14}}>
                        <button onClick={e=>toggleMine(p.name,e)} style={{background:'#052e16',border:'1px solid #22c55e66',color:'#22c55e',borderRadius:6,padding:'8px 14px',fontSize:10,cursor:'pointer',fontFamily:'inherit',fontWeight:700}}>✓ MY PICK</button>
                        <button onClick={e=>toggleGone(p.name,e)} style={{background:'#1a0808',border:'1px solid #7f1d1d',color:'#fca5a5',borderRadius:6,padding:'8px 14px',fontSize:10,cursor:'pointer',fontFamily:'inherit',fontWeight:700}}>✕ OFF THE BOARD</button>
                      </div>
                      <div style={{paddingTop:12,borderTop:'1px solid #1e293b'}}>
                        <div style={{color:'#94a3b8',fontSize:9,letterSpacing:'0.12em',marginBottom:8,fontWeight:700}}>VALUE SIGNAL</div>
                        {p.evPPG != null && (
                          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8,padding:'6px 10px',background:'#0d0d1f',borderRadius:6,border:'1px solid #3730a344',flexWrap:'wrap'}}>
                            <span style={{fontSize:9,color:'#a78bfa',fontWeight:700,letterSpacing:'0.1em'}}>EV MODEL</span>
                            <span style={{fontSize:13,fontWeight:800,color:'#a78bfa'}}>{p.evPPG} PPG</span>
                            <span style={{fontSize:9,color:'#94a3b8'}}>{p.pos==="QB"?"Vegas team pass volume × pass coeff + rush floor":"Vegas implied × target share × positional coeff"}</span>
                            <span style={{marginLeft:'auto',fontSize:11,fontWeight:700,color:p.evPPG>p.ppg?'#4ade80':p.evPPG<p.ppg?'#f87171':'#94a3b8'}}>{p.evPPG>p.ppg?`+${(p.evPPG-p.ppg).toFixed(1)} vs cons`:`${(p.evPPG-p.ppg).toFixed(1)} vs cons`}</span>
                          </div>
                        )}
                        <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap',marginBottom:8}}>
                          <span style={{fontSize:12,color:'#cbd5e1'}}>Consensus: <span style={{color:'#f1f5f9',fontWeight:800}}>{p.ppg} PPG</span></span>
                          <span style={{color:'#94a3b8',fontSize:12}}>vs</span>
                          <span style={{fontSize:12,color:'#cbd5e1'}}>ADP-implied: <span style={{color:'#f1f5f9',fontWeight:800}}>{p.value.exp} PPG</span></span>
                          <span style={{fontSize:14,fontWeight:800,color:p.value.color}}>{p.value.diff>0?'+':''}{p.value.diff}</span>
                        </div>
                        <div style={{fontSize:11,color:'#cbd5e1',lineHeight:1.6,padding:'10px 12px',background:'#111827',borderRadius:6,border:`1px solid ${p.value.color}44`}}>
                          {p.value.label==='UNDERVALUED'
                            ? `Consensus projects ${p.value.diff>0?'+':''}${p.value.diff} PPG above what ADP ${p.adp} implies. ${p.value.shade==='strong'?'Strong edge — meaningful mispricing by the market.':'Mild edge — slight discount vs. ADP expectation.'}`
                            : p.value.label==='OVERVALUED'
                            ? `Consensus projects ${Math.abs(p.value.diff)} PPG below what ADP ${p.adp} implies. ${p.value.shade==='strong'?'Strong signal — paying a significant premium over projected production.':'Mild signal — marginal premium, borderline FAIR.'}`
                            : `Consensus PPG is within 0.7 PPG of ADP-implied production. No meaningful edge — draft on positional need and roster construction.`
                          }
                        </div>
                        {p.injury_flag && p.games < 17 && (
                          <div style={{fontSize:10,color:'#f97316',marginTop:6}}>Injury-adjusted · Projecting {p.games}g → {p.season} pts</div>
                        )}
                      </div>
                    </td>
                  </tr>
                )}
              </React.Fragment>
            );
          })}
          </tbody>
            </table>
          </div>
        </>
      )}

      {/* ── ROSTER TAB ── */}
      {tab==="ROSTER" && (
        <div style={{padding:"16px 12px"}}>
          {myPicks.size===0
            ? <div style={{color:"#94a3b8",fontSize:12,textAlign:"center",marginTop:40}}>No picks yet — mark players ✓ on the BOARD tab.</div>
            : <>
                <div style={{fontSize:9,color:"#7c3aed",letterSpacing:"0.18em",fontWeight:800,marginBottom:10}}>STARTERS</div>
                {SLOTS.filter(s=>!s.bench).map((slot,si) => {
                  const p = rosterSlots[si];
                  const posColor = p ? PC[p.pos] : "#334155";
                  const posBg    = p ? PC_BG[p.pos] : "transparent";
                  return (
                    <div key={slot.key} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",marginBottom:6,borderRadius:7,background:p?"#0d1728":"#080c14",border:`1px solid ${p?posColor+"33":"#1e293b"}`}}>
                      <span style={{fontSize:9,fontWeight:800,color:"#94a3b8",letterSpacing:"0.1em",width:36,flexShrink:0}}>{slot.label}</span>
                      {p ? <>
                        <span style={{background:posBg,color:posColor,fontSize:9,fontWeight:800,padding:"1px 5px",borderRadius:3,border:`1px solid ${posColor}44`,flexShrink:0}}>{p.pos}</span>
                        <span style={{fontSize:14,fontWeight:700,color:"#f1f5f9",flex:1}}>{p.name}</span>
                        <span style={{fontSize:10,color:"#94a3b8",flexShrink:0}}>{p.team}</span>
                        <span style={{fontSize:13,fontWeight:800,color:posColor,flexShrink:0}}>{p.ppg}</span>
                        <span style={{fontSize:11,fontWeight:800,color:p.value.color,background:p.value.bg,padding:"2px 6px",borderRadius:4,border:`1px solid ${p.value.color}44`,whiteSpace:"nowrap",flexShrink:0}}>{p.value.label}</span>
                      </> : <span style={{fontSize:12,color:"#94a3b8",fontStyle:"italic"}}>Empty</span>}
                    </div>
                  );
                })}

                <div style={{fontSize:9,color:"#94a3b8",letterSpacing:"0.18em",fontWeight:800,margin:"18px 0 10px"}}>BENCH</div>
                {SLOTS.filter(s=>s.bench).map((slot,bi) => {
                  const si = SLOTS.findIndex(s=>s.bench) + bi;
                  const p = rosterSlots[si];
                  const posColor = p ? PC[p.pos] : "#334155";
                  const posBg    = p ? PC_BG[p.pos] : "transparent";
                  return (
                    <div key={slot.key} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",marginBottom:6,borderRadius:7,background:p?"#0b0f1a":"#080c14",border:`1px solid ${p?"#1e293b":"#0f1825"}`}}>
                      <span style={{fontSize:9,fontWeight:800,color:"#94a3b8",letterSpacing:"0.1em",width:36,flexShrink:0}}>BE</span>
                      {p ? <>
                        <span style={{background:posBg,color:posColor,fontSize:9,fontWeight:800,padding:"1px 5px",borderRadius:3,border:`1px solid ${posColor}44`,flexShrink:0}}>{p.pos}</span>
                        <span style={{fontSize:14,fontWeight:700,color:"#94a3b8",flex:1}}>{p.name}</span>
                        <span style={{fontSize:10,color:"#94a3b8",flexShrink:0}}>{p.team}</span>
                        <span style={{fontSize:13,fontWeight:800,color:posColor,flexShrink:0}}>{p.ppg}</span>
                      </> : <span style={{fontSize:12,color:"#94a3b8",fontStyle:"italic"}}>Empty</span>}
                    </div>
                  );
                })}

                {(()=>{
                  const starters = SLOTS.filter(s=>!s.bench).map((_,si)=>rosterSlots[si]).filter(Boolean);
                  const total = starters.reduce((sum,p)=>sum+p.ppg,0).toFixed(1);
                  return (
                    <div style={{marginTop:16,padding:"10px 12px",borderRadius:7,background:"#0d1424",border:"1px solid #1e293b",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <span style={{fontSize:10,color:"#94a3b8",letterSpacing:"0.1em"}}>PROJECTED STARTER PPG</span>
                      <span style={{fontSize:18,fontWeight:800,color:"#a78bfa"}}>{total}</span>
                    </div>
                  );
                })()}
              </>
          }
        </div>
      )}
